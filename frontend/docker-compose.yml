services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # From frontend/.env (or host env). No hardcoded API fallback.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://wixkednation.com}

    image: wixkednation-frontend:latest
    container_name: wixkednation-frontend

    ports:
      - "127.0.0.1:3001:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
